<path d="M330 285 L390 310 370 415 330 390Z" fill="#163f58" stroke="#75cbe5" stroke-width="3"/>
<path d="M870 285 L810 310 830 415 870 390Z" fill="#163f58" stroke="#75cbe5" stroke-width="3"/>
