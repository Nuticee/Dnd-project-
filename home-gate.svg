<path d="M0 350 L170 170 285 300 420 120 575 300 735 150 890 315 1040 190 1200 350 V520 H0Z" fill="#07131e"/>
<path d="M0 370 L170 215 285 315 420 170 575 320 735 195 890 330 1040 235 1200 370" fill="none" stroke="#2e6075" stroke-width="8" opacity=".35"/>
