 <path d="M315 455 Q335 415 355 455 L350 505 320 505Z"/><path d="M845 455 Q865 415 885 455 L880 505 850 505Z"/>
 <path d="M310 500 L280 600 M370 500 L400 600 M840 500 L810 600 M900 500 L930 600" stroke-width="10"/>
</g>
