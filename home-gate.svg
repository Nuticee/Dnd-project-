<g fill="#274657" stroke="#6e9eaf" stroke-width="2">
 <path d="M350 610 H850 L815 635 H385Z"/><path d="M330 635 H870 L835 660 H365Z"/><path d="M300 660 H900 L860 690 H340Z"/><path d="M260 690 H940 L895 725 H305Z"/>
</g>
