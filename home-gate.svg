<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#02050b"/><stop offset=".55" stop-color="#071727"/><stop offset="1" stop-color="#102f42"/></linearGradient>
 <linearGradient id="ice" x2="0" y2="1"><stop stop-color="#b9f1ff"/><stop offset=".35" stop-color="#4fa9cf"/><stop offset="1" stop-color="#173d55"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#172735"/><stop offset=".55" stop-color="#0b151f"/><stop offset="1" stop-color="#050b12"/></linearGradient>
 <radialGradient id="portal"><stop stop-color="#e9ffff"/><stop offset=".18" stop-color="#69dcff" stop-opacity=".95"/><stop offset=".5" stop-color="#1976a5" stop-opacity=".55"/><stop offset="1" stop-color="#061522" stop-opacity="0"/></radialGradient>
 <linearGradient id="snow" x2="0" y2="1"><stop stop-color="#dff9ff" stop-opacity=".8"/><stop offset="1" stop-color="#8ec9dc" stop-opacity=".15"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
 <pattern id="snowflakes" width="90" height="70" patternUnits="userSpaceOnUse"><circle cx="12" cy="18" r="1.5" fill="#fff"/><circle cx="54" cy="43" r="1" fill="#dff8ff"/><circle cx="78" cy="9" r="1.3" fill="#fff"/></pattern>
</defs>
<rect width="1200" height="800" fill="url(#sky)"/>
<circle cx="930" cy="125" r="70" fill="#dff7ff" opacity=".7" filter="url(#soft)"/>
<circle cx="930" cy="125" r="42" fill="#effcff" opacity=".88"/>
<g fill="#bfefff" opacity=".65"><circle cx="95" cy="95" r="2"/><circle cx="180" cy="155" r="1.5"/><circle cx="1080" cy="210" r="1.8"/><circle cx="1010" cy="70" r="1.2"/><circle cx="410" cy="80" r="1.4"/><circle cx="720" cy="125" r="1.2"/></g>
