<path d="M390 610 V405 Q390 265 600 210 Q810 265 810 405 V610Z" fill="#050c14" stroke="#547c8e" stroke-width="7"/>
<path d="M425 610 V414 Q425 305 600 260 Q775 305 775 414 V610Z" fill="#02080e" stroke="#2f5b70" stroke-width="4"/>
