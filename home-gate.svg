<path d="M500 610 V435 Q500 365 600 325 Q700 365 700 435 V610Z" fill="#071723" stroke="#75dfff" stroke-width="5"/>
<circle cx="600" cy="440" r="70" fill="none" stroke="#9cf0ff" stroke-width="5" opacity=".9"/>
<path d="M600 370 L620 420 675 430 630 465 640 520 600 490 560 520 570 465 525 430 580 420Z" fill="none" stroke="#bff7ff" stroke-width="4"/>
<path d="M535 610 Q600 555 665 610" fill="none" stroke="#65d7f6" stroke-width="4"/>
