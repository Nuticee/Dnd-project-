<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600">
<defs>
<linearGradient id="night" x2="0" y2="1"><stop stop-color="#01050d"/><stop offset=".45" stop-color="#071b2d"/><stop offset="1" stop-color="#020910"/></linearGradient>
<linearGradient id="ice" x2="0" y2="1"><stop stop-color="#f0fcff"/><stop offset=".22" stop-color="#8ee4ff"/><stop offset=".58" stop-color="#2b8fc2"/><stop offset="1" stop-color="#092b45"/></linearGradient>
<linearGradient id="iceDark" x2="0" y2="1"><stop stop-color="#174d68"/><stop offset=".5" stop-color="#0a273b"/><stop offset="1" stop-color="#04111c"/></linearGradient>
<linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff5b9"/><stop offset=".4" stop-color="#d1a74e"/><stop offset="1" stop-color="#634516"/></linearGradient>
<radialGradient id="aurora"><stop stop-color="#a6f4ff" stop-opacity=".5"/><stop offset=".5" stop-color="#3ecbff" stop-opacity=".18"/><stop offset="1" stop-color="#071b2c" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="900" height="1600" fill="url(#night)"/>
<!-- aurora and stars -->
<path d="M0 270 Q170 80 340 260 T700 180 T900 280" fill="none" stroke="#62e3ff" stroke-opacity=".2" stroke-width="55" filter="url(#blur)"/>
<ellipse cx="450" cy="440" rx="360" ry="330" fill="url(#aurora)" filter="url(#blur)"/>
<g fill="#e5fbff" opacity=".8"><circle cx="75" cy="150" r="2"/><circle cx="150" cy="310" r="1.5"/><circle cx="230" cy="105" r="2"/><circle cx="690" cy="120" r="2"/><circle cx="790" cy="250" r="1.5"/><circle cx="845" cy="410" r="2"/><circle cx="55" cy="470" r="1.5"/><circle cx="625" cy="220" r="1.5"/></g>
<!-- distant mountains -->
<g fill="#071725"><path d="M0 780 125 470 220 650 355 350 500 780Z"/><path d="M400 780 565 360 680 610 805 310 900 780Z"/></g>
<g fill="#123c55"><path d="M0 790 135 570 225 790Z"/><path d="M670 790 805 520 900 790Z"/></g>
<g fill="#bcefff" opacity=".65"><path d="M355 350 315 475 355 445 385 490Z"/><path d="M805 310 760 445 805 415 840 465Z"/></g>
<!-- colossal side towers -->
<g stroke="#62cfff" stroke-width="5">
<path d="M75 1190V440L120 245 170 440V1190Z" fill="url(#iceDark)"/>
<path d="M730 1190V440L780 245 825 440V1190Z" fill="url(#iceDark)"/>
<path d="M145 500 215 180 285 420V1190H145Z" fill="url(#ice)"/>
<path d="M615 420 685 180 755 500V1190H615Z" fill="url(#ice)"/>
</g>
<!-- crystalline spires -->
<g fill="url(#ice)" stroke="#a7ecff" stroke-width="3">
<path d="M75 440 120 120 165 440Z"/><path d="M165 420 215 65 270 420Z"/>
<path d="M630 420 685 65 735 420Z"/><path d="M735 440 780 120 825 440Z"/>
<path d="M280 390 325 95 365 380Z"/><path d="M535 380 575 95 620 390Z"/>
</g>
<!-- gothic crown -->
<path d="M175 545 225 220 305 365 450 45 595 365 675 220 725 545 665 625 235 625Z" fill="url(#ice)" stroke="#b6f1ff" stroke-width="7"/>
<path d="M230 625 Q450 360 670 625V1200H230Z" fill="#061725" stroke="url(#gold)" stroke-width="8"/>
<!-- monumental gate -->
<path d="M250 1200V650 Q450 415 650 650V1200Z" fill="url(#iceDark)" stroke="#79ddff" stroke-width="7"/>
<path d="M450 500V1200" stroke="url(#gold)" stroke-width="5"/>
<path d="M270 690 Q450 520 630 690 M285 755 Q450 610 615 755" fill="none" stroke="#43c8ff" stroke-width="4" opacity=".8"/>
<!-- giant central rune -->
<circle cx="450" cy="805" r="128" fill="none" stroke="#bff5ff" stroke-width="4" opacity=".9"/>
<circle cx="450" cy="805" r="92" fill="none" stroke="#75ddff" stroke-width="3" stroke-dasharray="10 13"/>
<path d="M450 685 486 765 570 805 486 845 450 925 414 845 330 805 414 765Z" fill="none" stroke="#e6fcff" stroke-width="5"/>
<circle cx="450" cy="805" r="18" fill="#dffbff" filter="url(#glow)"/>
<!-- guardian statues -->
<g fill="#06121e" stroke="#83ddff" stroke-width="4">
<path d="M42 1190V760 Q55 700 100 670 Q145 700 158 760V1190Z"/>
<path d="M742 1190V760 Q755 700 800 670 Q845 700 858 760V1190Z"/>
<path d="M62 800 100 705 138 800 120 940 80 940Z"/>
<path d="M762 800 800 705 838 800 820 940 780 940Z"/>
</g>
<!-- banners -->
<g stroke="url(#gold)" stroke-width="4" fill="#071827"><path d="M18 525H115V1030L67 1085 18 1030Z"/><path d="M785 525H882V1030L833 1085 785 1030Z"/></g>
<g fill="#9feeff"><path d="M67 620 94 648 67 676 40 648Z"/><path d="M833 620 860 648 833 676 806 648Z"/></g>
<!-- lanterns -->
<g stroke="url(#gold)" stroke-width="5" fill="#07131c"><path d="M105 1030V900H150V1030Z"/><path d="M750 1030V900H795V1030Z"/></g>
<g fill="#ffe8a0" filter="url(#glow)"><circle cx="127" cy="930" r="20"/><circle cx="772" cy="930" r="20"/></g>
<!-- grand bridge -->
<path d="M0 1600V1160 Q450 1060 900 1160V1600Z" fill="#04111b"/>
<path d="M0 1280 Q450 1160 900 1280 M0 1435 Q450 1300 900 1435" fill="none" stroke="#1b6483" stroke-width="7"/>
<path d="M0 1160 Q450 1060 900 1160" fill="none" stroke="url(#gold)" stroke-width="4"/>
<!-- foreground ice shards -->
<g fill="#55cfff" opacity=".55"><path d="M0 1500 95 1190 155 1600Z"/><path d="M900 1500 805 1190 745 1600Z"/><path d="M135 1600 205 1300 270 1600Z"/><path d="M765 1600 695 1300 630 1600Z"/></g>
</svg>